<h3 class="title">Add Category</h3>
   <form>
		<div class="mb-3">
			<label for="sp-category-title" class="form-label">Title</label>
			<input type="text" class="form-control" id="sp-category-title" required>
		</div>
		<div class="mb-3">
			<label for="sp-category-Description" class="form-label">Description</label>
			<textarea class="form-control" id="sp-category-Description" rows="3"></textarea>
		</div>
		 <div class="pt-3">
			<button type="submit" class="btn btn-primary">Submit</button>
		</div>
   </form>
